plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.signalarchive.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.signalarchive.app'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.3.6'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}

chaquopy {
    defaultConfig {
        version = '3.14'
        buildPython('python3.14')
        pip {
            install('./libs/pyaes-1.6.1-py3-none-any.whl')
            install('Telethon==1.45.0')
        }
    }
}
